[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photonic-balanced-partitioning"
version = "0.1.0"
description = "Constraint-Preserving Photonic Quantum Optimization for Balanced Graph Partitioning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "scipy==1.17.1"]

[project.optional-dependencies]
science = ["matplotlib==3.11.2"]
test = ["pytest==8.4.2", "hypothesis==6.141.1"]
qpu = ["perceval-quandela==1.3.0", "exqalibur==1.4.2"]
all = ["matplotlib==3.11.2", "pytest==8.4.2", "hypothesis==6.141.1", "perceval-quandela==1.3.0", "exqalibur==1.4.2"]

[project.scripts]
pbp = "photonic_balanced_partitioning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/photonic_balanced_partitioning"]
