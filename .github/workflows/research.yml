name: Local research verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements-research-lock.txt
            pyproject.toml
      - name: Install pinned research environment
        run: |
          python -m pip install -r requirements-research-lock.txt
          python -m pip install -e '.[all]'
      - name: Unit, physics, archive and offline QPU tests
        run: python -m pytest tests/ -q
      - name: Check publication source and generated artifacts
        run: |
          python scripts/check_archive_preservation.py
          python scripts/build_publication.py --check
      - name: Install official pinned TeX compiler
        shell: bash
        run: |
          curl --fail --location --retry 2 --output /tmp/tectonic.tar.gz https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-musl.tar.gz
          echo "60b13a0826ae7ad9ce34b4a2df06bff2cfcfa6dda8a915477c0cbb84e1a4a902  /tmp/tectonic.tar.gz" | sha256sum --check
          mkdir -p /tmp/pbp-tectonic
          tar -xzf /tmp/tectonic.tar.gz -C /tmp/pbp-tectonic
      - name: Compile and verify manuscript
        run: |
          /tmp/pbp-tectonic/tectonic --untrusted --keep-logs paper/main.tex
          python scripts/verify_manuscript.py --receipt /tmp/manuscript-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-manuscript
          path: |
            paper/main.pdf
            paper/main.log
            paper/publication_manifest.json
            /tmp/manuscript-build.json
